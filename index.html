<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کاکا سندی | ادیت مخصوص</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- صفحه اصلی -->
    <section class="page" id="home">

        <div class="main-title">کاکا سندی</div>

        <div class="subtitle">
            بیا این ادیتت احمق 😂
        </div>

        <button class="edit-button" onclick="startPrank()">
            ادیت کاکا سندی
        </button>

    </section>


    <!-- صفحه ماتریکس -->
    <section class="page hidden" id="matrixPage">

        <canvas id="matrix"></canvas>

        <div class="matrix-content">
            <div class="hacked">هک شدی!</div>

            <div class="evil">😈😂</div>

            <h2>سیستم در حال بررسی است...</h2>
        </div>

    </section>


    <!-- صفحه شوخی -->
    <section class="page hidden" id="jokePage">

        <div class="joke-title">شوخی کردم!</div>

        <p class="download-text">
            ادیتت الان دانلود میشه...
        </p>

        <div class="laugh">😂🤣</div>

        <h2>فکر کردی واقعاً هک شدی؟!</h2>

    </section>


    <script src="script.js"></script>
</body>
</html>
